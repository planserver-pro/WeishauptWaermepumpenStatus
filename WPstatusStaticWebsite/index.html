<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="">
        <title>Wärmepumpe</title>
        <!-- Bootstrap core CSS -->
        <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
        <!-- Custom styles for this template -->
        <link href="fonts/roboto.css" rel="stylesheet">
        <link href="starter-template.css" rel="stylesheet">
    </head>
    <body>
        <div class="col-lg-8 mx-auto p-3 py-md-5">
            <header class="d-flex align-items-center pb-3 mb-5 border-bottom"><a href="#" class="d-flex align-items-center text-dark text-decoration-none"> <span class="fs-4">Baugemeinschaftshaus HalbInsulaner</span> </a>
            </header>
            <main>
                <h1>Aktueller Status der Wärmepumpe:</h1>
                <h1><span id="wpstatus" class="wpstatus" class="has-menu"></span><br/><span class="smalltext" id="wpstatusdate"></span></h1>
                <div class="mb-5">
</div>
                <p>Status der letzten Tage:</p>
                <p id="wpstatusold">[wird geladen...]</p>
                <p></p>
                <p></p>
            </main>
            <footer class="pt-5 my-5 text-muted border-top">&copy; 2025 planserver.pro GmbH</footer>
        </div>
        <script src="assets/js/popper.min.js"></script>
        <script src="bootstrap/js/bootstrap.min.js"></script>
        <script>
     fetch('wpstatus.json')
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok ' + response.statusText);
        }
        return response.json();
    })
    .then(data => {
        var statusse=data;
        var oldstat="";
		for (i = 0; i < statusse.length; i++) {
            var status=statusse[i];
            //ersten Status ganz oben plazieren
            if (i == 0) {
                document.getElementById("wpstatus").innerHTML=status.status;
   
                if (status.mailsent) {
                                 document.getElementById("wpstatusdate").innerHTML=status.statusdate+" <span class='mailsent'>eMail-Benachrichtigung ist erfolgt: "+status.mailsent+"</span>";
                }
                else
                {
                             document.getElementById("wpstatusdate").innerHTML=status.statusdate;
                }
            }
            else
            {
                oldstat=oldstat+status.statusdate+" - "+status.status;
                if (status.mailsent) {
                    oldstat=oldstat+" <span class='mailsent'>eMail-Benachrichtigung ist erfolgt: "+status.mailsent+"</span>";
                }
                oldstat=oldstat+"<br/>";
            }
        }
        document.getElementById("wpstatusold").innerHTML=oldstat;

    })
    .catch(error => {
        console.error('There has been a problem with your fetch operation:', error);
    });
        </script>
    </body>
</html>
